function aggregate(a){return `<section class="panel"><h3>按类型汇总</h3><div class="scroll"><table id="type-table"><thead><tr><th>类型</th><th>计划</th><th>应执行</th><th>已执行</th><th>待执行</th><th>应执行未执行</th>${fields.map(([,n])=>`<th>${n}</th>`).join('')}</tr></thead><tbody>${types.map(t=>{const b=a.filter(r=>r.type===t),c=counts(b);return `<tr><td><button class="link" data-nav="${t}">${t} →</button></td><td>${c.total}</td><td>${c.due}</td><td>${c.done}</td><td>${c.pending}</td><td class="${c.late?'bad':''}">${c.late}</td>${fields.map(([k])=>`<td>${value(b,k)}</td>`).join('')}</tr>`}).join('')}</tbody></table></div></section>`}
function hourly(a){const hours=[...new Set(a.map(r=>r.h))].sort(),max=Math.max(1,...hours.map(h=>counts(a.filter(r=>r.h===h)).total));return `<section class="panel"><div class="row"><h3>每小时执行情况</h3><span class="sub">按计划小时归属 · 点击筛选 · 右侧：已执行 / 计划</span></div><div class="legend"><span><i style="background:var(--ok)"></i>已执行</span><span><i style="background:var(--pending)"></i>待执行</span><span><i style="background:var(--bad)"></i>应执行未执行</span></div><div class="hours">${hours.map(h=>{const c=counts(a.filter(r=>r.h===h));return `<div class="hour"><button data-hour="${h}" aria-pressed="${state.hour===h}" aria-label="${h}时，计划${c.total}次，已执行${c.done}次，待执行${c.pending}次，应执行未执行${c.late}次">${h}:00</button><div class="bar" aria-hidden="true"><span style="width:${100*c.done/max}%;background:var(--ok)"></span><span style="width:${100*c.pending/max}%;background:var(--pending)"></span><span style="width:${100*c.late/max}%;background:var(--bad)"></span></div><span>${c.done} / ${c.total}${c.late?` · 未执行 ${c.late}`:''}</span></div>`}).join('')}</div></section>`}
function baseDetail(a){const pages=Math.max(1,Math.ceil(a.length/10));state.pageNo=Math.min(state.pageNo,pages);const show=a.slice((state.pageNo-1)*10,state.pageNo*10);return `<section class="panel"><div class="row"><h3>策略批次明细</h3><span class="sub">单位：条 · 每页 10 条</span></div><div class="scroll"><table id="detail-table"><thead><tr><th>策略名称 / ID</th><th>类型</th><th>计划时间</th><th>执行状态</th>${fields.map(([,n])=>`<th>${n}</th>`).join('')}<th>批次</th></tr></thead><tbody>${show.map(r=>`<tr><td class="name">${esc(r.name)}<div class="sub">${esc(r.id)}</div></td><td>${esc(r.type)}</td><td>${r.time.slice(11,16)}</td><td class="${r.done?'ok':r.due?'bad':''}">${r.status}</td>${fields.map(([k])=>`<td class="${(k==='f'||k==='p')&&r[k]>0?'bad':''}">${fmt(r[k])}</td>`).join('')}<td><button class="link" data-detail="${r.i}">查看</button></td></tr>`).join('')}</tbody></table></div>${a.length?'':'<div class="empty">没有符合条件的策略</div>'}<div class="row pager"><span class="sub">共 ${a.length} 条 · 第 ${state.pageNo} / ${pages} 页</span><div><button data-prev ${state.pageNo===1?'disabled':''}>上一页</button> <button data-next ${state.pageNo===pages?'disabled':''}>下一页</button></div></div></section>`}
function baseSelected(){const r=rows.find(r=>r.i===state.selected);if(!r)return '';const unknown=r.n!==null&&r.s!==null&&r.f!==null?r.n-r.s-r.f:null;return `<section class="panel" id="batch-trace"><div class="row"><h3>${esc(r.name)} · 批次追踪</h3><button data-close>收起</button></div><p class="sub">${esc(r.type)} · 策略 ${esc(r.id)} · 计划 ${esc(r.time.replace('T',' '))} · ${r.status}</p><div class="steps">${fields.map(([k,n])=>`<div class="step"><span class="sub">${n}</span><strong>${fmt(r[k])}</strong></div>`).join('')}</div><p class="mono">执行批次：${esc(r.batch||'未提供')}</p>${unknown>0?`<p class="bad">应发与实发＋失败相差 ${fmt(unknown)} 条；按 SQL 口径为空状态数量。</p>`:''}<p class="sub">${!r.done?'该计划未匹配到执行记录。':fields.some(([k])=>r[k]===null)?'部分数量未提供，不能解释为 0；仅凭本次导出无法判定具体缺失原因。':'以上均为附件中的批次汇总数量。'} 附件未提供逐消息回调明细和回调成功结果。</p></section>`}
function baseRules(){return `<details><summary>指标定义与数据范围</summary><div class="panel"><p>数据来源：export (63).csv，各国按各自最新数据日期展示一天。日期以页面顶部为准。应执行、已执行标记以附件快照为准，不随打开页面的时间变化；精确导出时刻未提供。</p><p>计划按国家＋类型＋策略ID＋计划时间去重，已执行表示存在执行记录。发送数量按国家＋类型＋执行批次去重，只合计已有执行记录的批次。单位为消息条数，不是债务人数。</p><p>应发为类型匹配的消息记录数；实发为 status 非空且不等于 2；失败为 status = 2。空状态不计入实发或失败。类型映射：SMS→sms、IVR→ivr、Email→email、WABA→whatsapp、Viber→viber、上行短信→uplink_sms。</p><p>IVR、Email 按 request_key 匹配各自结果表；SMS 按 supplier_no = 短信分片表 sms_request_id 匹配；WABA、Viber、上行短信按 supplier_no = 聊天表 message_id 匹配。已回调不等于成功送达。待回调直接使用导出值，不把空值补成 0。</p><p>部分合计只覆盖有值的批次，并标注缺失批次数；普通 SMS 的回调取自短信分片表；是否包含上行短信策略及回调数量以本次导出为准。待执行、未执行批次不参与下游汇总。当前仅显示附件已有数据，无债务人级、消息级或成功回调明细。</p><p>“应执行未执行”受 SQL 同分钟关联与入仓延迟影响，“待回调”也可能仍在等待，均不能仅凭快照认定业务故障。</p></div></details>`}
function render(){nav();const base=state.page==='总览'?rows:rows.filter(r=>r.type===state.page),a=filtered(base),c=counts(a);content.innerHTML=`<div class="row"><h3>${state.page==='总览'?'当日全局概览':state.page+' · 类型监控'}</h3><span class="sub">${state.hour||state.q||state.status||state.issue?'当前筛选范围':'全天快照'} · ${a.length} 条记录</span></div>${controls(base)}${summary(a)}${c.late?`<div class="notice"><span>有 ${c.late} 次到期计划未匹配到执行记录</span><button data-alert>查看未执行计划</button></div>`:''}${downstream(a)}${state.page==='总览'?aggregate(a):''}${hourly(base)}${selected()}${detail(a)}${rules()}`;}
const ages=['D-2~0','D1-7','D8-15','D16-30','D30+','其他'];
function classify(name){
  const n=String(name||'').toUpperCase();
  if(/D1[_-]D?30/.test(n))return {age:'其他',why:'D1–D30 覆盖多个账龄段'};
  if(/D1246/.test(n))return {age:'其他',why:'D1246 含义未确认，单列其他'};
  const vals=[...n.matchAll(/D(?:[_-]([12])(?=\D|$)|(\d+))/g)].map(m=>m[1]?-Number(m[1]):Number(m[2]));
  const range=n.match(/D(\d+)[_~至到-](?:D)?(\d+)/);
  if(range)vals.push(Number(range[1]),Number(range[2]));
  const bin=v=>v<=0?'D-2~0':v<=7?'D1-7':v<=15?'D8-15':v<=30?'D16-30':'D30+';
  if(vals.length){const b=[...new Set(vals.map(bin))];return {age:b.length===1?b[0]:'其他',why:'名称账龄：'+vals.map(v=>'D'+v).join('、')}}
  if(/预提醒|预D|小于D0|P组|(?:^|_)P(?:_|队列|$)/.test(n))return {age:'D-2~0',why:'预提醒 / P 组'};
  if(/(?:^|_)A(?:队列|组|_|$)/.test(n))return {age:'D1-7',why:'A 队列'};
  if(/(?:^|_)B1(?:_|组|发送|$)/.test(n))return {age:'D8-15',why:'B1'};
  if(/(?:^|_)B2(?:_|组|$)/.test(n))return {age:'D16-30',why:'B2'};
  if(/M(?:[2-9]|\d{2,})/.test(n))return {age:'D30+',why:'M2 及以上'};
  return {age:'其他',why:'名称未提供可可靠识别的账龄'};
}

function tenthPercentile(values){const sorted=values.filter(Number.isFinite).sort((a,b)=>a-b);if(!sorted.length)return 100;const at=(sorted.length-1)*.1,lo=Math.floor(at),hi=Math.ceil(at);return Number((sorted[lo]+(sorted[hi]-sorted[lo])*(at-lo)).toFixed(2))}
const eligibleBatches=batches(rows),sendSamples=eligibleBatches.map(r=>rate(r.s,r.n)).filter(v=>v!==null),callbackSamples=eligibleBatches.map(r=>rate(r.c,r.s)).filter(v=>v!==null);
const defaultSendThreshold=tenthPercentile(sendSamples),defaultCallbackThreshold=tenthPercentile(callbackSamples);

const pct=v=>v===null?'—':v.toFixed(2)+'%';

function strategyCounts(a){const groups=new Map();plans(a).forEach(r=>{const k=JSON.stringify([r.country,r.type,r.id]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r)});const all=[...groups.values()],due=all.filter(g=>g.some(r=>r.due));return {total:all.length,due:due.length,done:due.filter(g=>g.filter(r=>r.due).every(r=>r.done)).length,late:due.filter(g=>g.some(r=>r.due&&!r.done)).length,pending:all.filter(g=>!g.some(r=>r.due)).length}}
function filtered(a){return a.filter(r=>(!state.hour||r.h===state.hour)&&(!state.age||r.age===state.age)&&(!state.matrixType||r.type===state.matrixType)&&(!state.q||(r.name+' '+r.id).toLowerCase().includes(state.q.toLowerCase()))&&(!state.status||r.status===state.status)&&issueMatches(r))}

  });
  return html.replace(/<td><button class="link" data-detail="(\d+)">/g,(m,id)=>{
    const r=rows[Number(id)];
    return `<td>${r.age}</td><td>${rateLabel({v:rate(r.s,r.n),missing:0},'send')}</td><td>${rateLabel({v:rate(r.c,r.s),missing:0},'callback')}</td>${m}`;
  });
}
function rules(){return baseRules()+`<details><summary>账龄分类与率值口径</summary><div class="panel"><p>策略执行率＝所有到期计划均已执行的策略数 / 有到期计划的策略数；计划执行率＝到期已执行次数 / 应执行次数。任务/策略比＝计划执行次数 / 策略数量。</p><p>实发率＝实发 / 应发；回调率＝已回调 / 实发。每种率仅在分子分母均有值的同一批次集合内计算，缺失批次不补0。低于阈值的橙色或紫色标记、到期未执行的红色标记均为快照提示，不直接判定业务故障。</p><p>实际开始执行时间取执行记录 create_at，执行总时长按数据源提供的秒数展示；未提供的值显示“—”。各国按国家＋数据日期选取最大日期，仅展示该国最新一天；没有国家字段的旧菲律宾导出按菲律宾兼容。点击异常数量筛选到对应任务明细，导出范围为当前筛选的全部行。</p><p>账龄按名称推断，显式D天数优先，其次P/预提醒、A、B1、B2、M2以上。D1246含义未明确、D1-D30跨多个段、仅“逾期”或没有天数的名称，统一归其他。</p><div class="scroll"><table><thead><tr><th>策略 / ID</th><th>归类</th><th>依据</th></tr></thead><tbody>${unique(scopeRows(),r=>JSON.stringify([r.country,r.type,r.id])).map(r=>`<tr><td class="name">${esc(r.name)} / ${r.id}</td><td>${r.age}</td><td>${r.why}</td></tr>`).join('')}</tbody></table></div></div></details>`}
function moduleNav(){return `<nav class="module-nav" aria-label="模块导航"><a href="#overview-section">策略执行概览</a><a href="#age-section">策略地图</a><a href="#type-section">策略任务执行汇总</a><a href="#hour-section">小时级渠道运行矩阵</a><a href="#detail-section">策略任务执行明细</a></nav>`}
function durationLabel(v){return v===null||v===undefined||String(v).trim()===''?'—':Number.isFinite(Number(v))?fmt(Number(v))+' 秒':esc(v)}
function countryControls(){return `<div class="country-scope"><label>国家 <select id="sm-country"><option value="">全部国家</option>${countries.map(c=>`<option value="${esc(c)}" ${state.country===c?'selected':''}>${esc(c)}</option>`).join('')}</select></label><div class="country-dates">${countries.filter(c=>!state.country||state.country===c).map(c=>`<span>${esc(c)} <b>${latestDateByCountry.get(c)}</b></span>`).join('')}</div><small class="sub">每个国家只展示导出数据中最新日期的一天数据</small></div>`}
function render(){
  nav();
  const base=scopeRows(),a=filtered(base);
  const drill=state.status==='应执行未执行'?'异常未执行':state.issue==='失败'?'发送失败':state.issue==='待回调'?'待回调':'';
  content.innerHTML=`<div class="row"><h3>${state.page==='总览'?'最新日期概览':state.page+' · 类型监控'}</h3><span class="sub">${a.length} 条记录 · 各国最新日期</span></div>${countryControls()}${controls(base)}${moduleNav()}<div class="thresholds"><label>实发率提示阈值（%）<input id="send-threshold" type="number" min="0" max="100" step="0.01" value="${state.sendThreshold}"></label><label>回调率提示阈值（%）<input id="callback-threshold" type="number" min="0" max="100" step="0.01" value="${state.callbackThreshold}"></label><button data-threshold>应用阈值</button><span class="sub">默认按当前有效批次率的第10百分位设定：实发${defaultSendThreshold}%，回调${defaultCallbackThreshold}%；实发${sendSamples.length}批、回调${callbackSamples.length}批。仅为快照提示线。</span></div>${drill?`<p class="filter-note">已定位：${drill}任务 · ${a.length} 条 <button data-clear-drill>清除定位</button></p>`:''}${state.age||state.matrixType?`<p class="filter-note">地图筛选：${state.matrixType||'全部类型'} / ${state.age||'全部账龄'}${state.hour?' / '+state.hour+':00':''} <button data-clear-map>清除地图筛选</button></p>`:''}${summary(a)}${matrix(base,'age')}${aggregate(a)}${hourly(base)}${detail(a)}${selected()}${rules()}`;
}
function exportRows(a){
  const columns=[['国家',r=>r.country],['数据日期',r=>r.date],['策略名称',r=>r.name],['策略ID',r=>r.id],['触达类型',r=>r.type],['账龄',r=>r.age],['计划时间',r=>r.time],['实际开始执行时间',r=>r.startedAt],['执行总时长',r=>r.duration],['执行状态',r=>r.status],['应发数量',r=>r.n],['实发数量',r=>r.s],['发送失败数量',r=>r.f],['已回调数量',r=>r.c],['待回调数量',r=>r.p],['实发率',r=>pct(rate(r.s,r.n))],['回调率',r=>pct(rate(r.c,r.s))],['执行批次',r=>r.batch]];
  const cell=v=>{const raw=String(v===null||v===undefined||v===''?'—':v),safe=/^[=+\-@\t\r]/.test(raw)?"'"+raw:raw;return '"'+safe.replace(/"/g,'""')+'"'};
  const lines=[columns.map(([name])=>cell(name)).join(','),...a.map(r=>columns.map(([,get])=>cell(get(r))).join(','))];
  const blob=new Blob(['\ufeff',lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');
  link.href=url;link.download='策略任务执行明细_'+(state.country?latestDateByCountry.get(state.country):'2026-10-10')+'.csv';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
root.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.hasAttribute('data-jump-issue')){
    const kind=b.dataset.jumpIssue;
    Object.assign(state,{hour:'',age:'',matrixType:'',q:'',status:kind==='late'?'应执行未执行':'',issue:kind==='failed'?'失败':kind==='pending'?'待回调':'',pageNo:1,selected:null});
    render();document.getElementById('detail-section').scrollIntoView({block:'start'});
  }else if(b.hasAttribute('data-export')){
    exportRows(filtered(scopeRows()));
  }else if(b.hasAttribute('data-cell-type')){
    Object.assign(state,{matrixType:b.dataset.cellType,age:b.dataset.cellAge||'',hour:b.dataset.cellHour||'',q:'',status:'',issue:'',pageNo:1,selected:null});
    render();document.getElementById('detail-section').scrollIntoView({block:'start'});
  }else if(b.hasAttribute('data-threshold')){
    const s=root.querySelector('#send-threshold'),c=root.querySelector('#callback-threshold');
    if(!s.reportValidity()||!c.reportValidity()||s.value===''||c.value==='')return;
    state.sendThreshold=Number(s.value);state.callbackThreshold=Number(c.value);render();
  }else if(b.hasAttribute('data-clear-map')){
    Object.assign(state,{age:'',matrixType:'',hour:'',pageNo:1});render();
  }else if(b.hasAttribute('data-clear-drill')){
    Object.assign(state,{status:'',issue:'',pageNo:1});render();
  }else if(b.hasAttribute('data-reset')||b.dataset.nav){state.age='';state.matrixType=''}
},true);
function selected(){const html=baseSelected(),r=rows.find(x=>x.i===state.selected);if(!r)return html;return html.replace('<div class="steps">',`<div class="rate-overview"><div><span class="sub">实发率</span><strong>${rateLabel({v:rate(r.s,r.n),missing:0},'send')}</strong></div><div><span class="sub">回调率</span><strong>${rateLabel({v:rate(r.c,r.s),missing:0},'callback')}</strong></div></div><div class="steps">`)}
function matrix(a,mode){
  if(mode!=='age')return matrixFull(a);
  const showTypes=types.filter(t=>a.some(r=>r.type===t));
  return `<section class="panel" id="age-section"><div class="row"><h3>策略地图</h3><span class="sub">类型 × 账龄 · 点击筛选明细 · 跨段及不明确名称归其他</span></div><div class="matrix-legend"><span class="execution-low">红：存在异常未执行</span></div><div class="scroll"><table class="matrix age-counts" id="age-matrix"><thead><tr><th>类型 / 账龄</th>${ages.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${showTypes.map(t=>`<tr><th>${t}</th>${ages.map(col=>{const b=a.filter(r=>r.type===t&&r.age===col),p=counts(b),s=strategyCounts(b);if(!b.length)return '<td class="matrix-empty">—</td>';return `<td><button class="matrix-cell ${p.late?'has-late':''}" data-cell-type="${t}" data-cell-age="${col}" aria-label="${t} ${col}，${s.total}个策略，${p.total}次计划执行，${p.late}次异常未执行"><span class="age-metric"><span>策略数量</span><b>${s.total}<small>个</small></b></span><span class="age-metric"><span>计划执行</span><b>${p.total}<small>次</small></b></span><span class="age-metric age-exception ${p.late?'execution-low':''}"><span>异常未执行</span><b>${p.late}<small>次</small></b></span></button></td>`}).join('')}</tr>`).join('')}</tbody></table></div></section>`;
}

root.addEventListener('change',e=>{
  if(e.target.id!=='sm-country')return;
  Object.assign(state,{country:e.target.value,hour:'',age:'',matrixType:'',q:'',status:'',issue:'',pageNo:1,selected:null});
  render();
});

root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;let scroll=false;if(b.dataset.nav){state.page=b.dataset.nav;state.q='';state.status='';state.issue='';state.pageNo=1;state.selected=null;}else if(b.hasAttribute('data-filter')){state.q=root.querySelector('#sm-q').value.trim();state.hour=root.querySelector('#sm-hour').value;state.status=root.querySelector('#sm-status').value;state.issue=root.querySelector('#sm-issue').value;state.pageNo=1;state.selected=null;}else if(b.hasAttribute('data-reset'))Object.assign(state,{hour:'',q:'',status:'',issue:'',pageNo:1,selected:null});else if(b.hasAttribute('data-alert'))Object.assign(state,{status:'应执行未执行',issue:'',pageNo:1,selected:null});else if(b.hasAttribute('data-hour')){state.hour=state.hour===b.dataset.hour?'':b.dataset.hour;state.pageNo=1;state.selected=null;}else if(b.hasAttribute('data-prev'))state.pageNo--;else if(b.hasAttribute('data-next'))state.pageNo++;else if(b.hasAttribute('data-detail')){state.selected=Number(b.dataset.detail);scroll=true;}else if(b.hasAttribute('data-close'))state.selected=null;else return;render();if(scroll)document.getElementById('batch-trace').scrollIntoView({block:'nearest'});});
root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='sm-q')root.querySelector('[data-filter]').click()});
render();
})();








</script></div></body></html>
