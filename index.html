function classify(name){

  if(/D1[_-]D?30/.test(n))return {age:'其他',why:'D1–D30 覆盖多个账龄段'};

  const range=n.match(/D(\d+)[_~至到-](?:D)?(\d+)/);
  if(range)vals.push(Number(range[1]),Number(range[2]));
  const bin=v=>v<=0?'D-2~0':v<=7?'D1-7':v<=15?'D8-15':v<=30?'D16-30':'D30+';
  if(vals.length){const b=[...new Set(vals.map(bin))];return {age:b.length===1?b[0]:'其他',why:'名称账龄：'+vals.map(v=>'D'+v).join('、')}}

  if(/(?:^|_)A(?:队列|组|_|$)/.test(n))return {age:'D1-7',why:'A 队列'};

    const b=a.filter(r=>r.type===t&&r.h===h),p=counts(b),s=strategyCounts(b),sr=paired(b,'s','n'),cr=paired(b,'c','s');
    if(!b.length)return '<td class="matrix-empty">—</td>';
    return `<td><button class="matrix-cell ${p.late?'has-late':''}" data-cell-type="${t}" data-cell-hour="${h}" aria-label="${t} ${h}时，${s.total}个策略，${p.total}次计划，${p.late}次未执行"><b>${s.total} 策略 · ${p.total} 计划</b><span class="${p.late?'execution-low':''}">异常未执行 ${p.late} 次</span><span>执行率 <strong class="${p.late?'execution-low':''}">${pct(rate(plans(b).filter(r=>r.due&&r.done).length,p.due))}</strong></span><span>实发率 ${rateLabel(sr,'send')}</span><span>回调率 ${rateLabel(cr,'callback')}</span></button></td>`;
  }).join('')}</tr>`).join('');
  const footer=hours.map(h=>{const n=counts(a.filter(r=>r.h===h)).total;return `<td><div class="hour-total"><b>${n}<small>次</small></b><span>全天占比 ${pct(rate(n,allTasks))}</span></div></td>`}).join('');
  return `<section class="panel" id="hour-section"><div class="row"><h3>小时级渠道运行矩阵</h3><span class="sub">类型 × 计划小时 · 点击单元格定位明细</span></div><div class="matrix-legend"><span class="execution-low">红：到期未执行</span><span class="send-low">橙：实发率低于 ${state.sendThreshold}%</span><span class="callback-low">紫：回调率低于 ${state.callbackThreshold}%</span><span class="sub">—：无任务或无分母；仅提示快照缺口</span></div><div class="scroll"><table class="matrix" id="hour-matrix"><thead><tr><th>类型 / 小时</th>${hours.map(h=>`<th>${h}:00</th>`).join('')}</tr></thead><tbody>${body}</tbody><tfoot><tr><th>${state.page==='总览'?'全渠道':'本类型'}合计<br><small>全天 ${allTasks} 次</small></th>${footer}</tr></tfoot></table></div><p class="sub">全天占比＝该小时计划任务数 ÷ 全天计划任务数；每个计划按类型、策略 ID、计划时间去重。</p></section>`;
}
function hourly(a){return matrixFull(a)}
function detail(a){
  let html=baseDetail(a);
  html=html.replace('<section class="panel">','<section class="panel" id="detail-section">')
    .replace('<h3>策略批次明细</h3>','<h3>策略任务执行明细</h3>')
    .replace('<th>策略名称 / ID</th>','<th>国家</th><th>策略名称 / ID</th>')
    .replace('<span class="sub">单位：条 · 每页 10 条</span>','<div class="detail-actions"><span class="sub">每页 10 条 · 导出当前筛选的全部明细</span><button type="button" data-export>导出 CSV</button></div>')
    .replace('<th>计划时间</th>','<th>计划时间</th><th>实际开始执行时间</th><th>执行总时长</th>')
    .replace('<th>批次</th>','<th>账龄</th><th>实发率</th><th>回调率</th><th>批次</th>');
  html=html.replace(/<tr>[\s\S]*?<\/tr>/g,m=>{
    const id=m.match(/data-detail="(\d+)"/);
    if(!id)return m;
    const r=rows[Number(id[1])];
    return m.replace('<tr>',`<tr><td>${esc(r.country)}</td>`).replace(/(<td>\d{2}:\d{2}<\/td>)/,`$1<td>${esc((r.startedAt||'—').replace('T',' '))}</td><td>${durationLabel(r.duration)}</td>`);
  });
  return html.replace(/<td><button class="link" data-detail="(\d+)">/g,(m,id)=>{
    const r=rows[Number(id)];
    return `<td>${r.age}</td><td>${rateLabel({v:rate(r.s,r.n),missing:0},'send')}</td><td>${rateLabel({v:rate(r.c,r.s),missing:0},'callback')}</td>${m}`;
  });
}
function rules(){return baseRules()+`<details><summary>账龄分类与率值口径</summary><div class="panel"><p>策略执行率＝所有到期计划均已执行的策略数 / 有到期计划的策略数；计划执行率＝到期已执行次数 / 应执行次数。任务/策略比＝计划执行次数 / 策略数量。</p><p>实发率＝实发 / 应发；回调率＝已回调 / 实发。每种率仅在分子分母均有值的同一批次集合内计算，缺失批次不补0。低于阈值的橙色或紫色标记、到期未执行的红色标记均为快照提示，不直接判定业务故障。</p><p>实际开始执行时间取执行记录 create_at，执行总时长按数据源提供的秒数展示；未提供的值显示“—”。日期默认采用北京时间今日，墨西哥采用北京时间前一天；默认日期无数据时提示无数据，可手动选择已有日期；没有国家字段的旧菲律宾导出按菲律宾兼容。点击异常数量筛选到对应任务明细，导出范围为当前筛选的全部行。</p><p>账龄按名称推断，显式D天数优先，其次P/预提醒、A、B1、B2、M2以上。D1246含义未明确、D1-D30跨多个段、仅“逾期”或没有天数的名称，统一归其他。</p><div class="scroll"><table><thead><tr><th>策略 / ID</th><th>归类</th><th>依据</th></tr></thead><tbody>${unique(scopeRows(),r=>JSON.stringify([r.country,r.type,r.id])).map(r=>`<tr><td class="name">${esc(r.name)} / ${r.id}</td><td>${r.age}</td><td>${r.why}</td></tr>`).join('')}</tbody></table></div></div></details>`}
function moduleNav(){return `<nav class="module-nav" aria-label="模块导航"><a href="#overview-section">策略执行概览</a><a href="#age-section">策略地图</a><a href="#type-section">策略任务执行汇总</a><a href="#hour-section">小时级渠道运行矩阵</a><a href="#detail-section">策略任务执行明细</a></nav>`}
function durationLabel(v){return v===null||v===undefined||String(v).trim()===''?'—':Number.isFinite(Number(v))?fmt(Number(v))+' 秒':esc(v)}
function countryControls(){
  const dates=[...new Set(rows.filter(r=>!state.country||r.country===state.country).map(r=>r.date))].sort().reverse();
  const today=beijingToday(),visible=countries.filter(c=>!state.country||state.country===c),missing=[];
  const badges=visible.map(c=>{const d=state.date||countryDefaultDate(c,today),has=rows.some(r=>r.country===c&&r.date===d);if(!has)missing.push(c+' '+d);return `<span>${esc(c)} <b>${d}</b>${has?'':' · 无数据'}</span>`}).join('');
  const defaultLabel=state.country?countryDefaultDate(state.country,today)+(state.country==='墨西哥'?'（北京昨日）':'（北京今日）'):'按国家默认日期';
  return `<div class="country-scope"><label>国家 <select id="sm-country"><option value="">全部国家</option>${countries.map(c=>`<option value="${esc(c)}" ${state.country===c?'selected':''}>${esc(c)}</option>`).join('')}</select></label><label>日期 <select id="sm-date"><option value="">${defaultLabel}</option>${dates.map(d=>`<option value="${d}" ${state.date===d?'selected':''}>${d}</option>`).join('')}</select></label><div class="country-dates">${badges}</div><small class="sub">${state.date?'展示所选日期的数据':'默认：北京时间今日，墨西哥为前一天'}</small></div>${missing.length?`<p class="filter-note" id="date-empty-note">${esc(missing.join('、'))} 暂无数据，可选择已有日期查看。</p>`:''}`;
}
function render(){
  nav();
  root.querySelector('#sm-global-filters').innerHTML=countryControls();
  const base=scopeRows(),a=filtered(base);
  const drill=state.status==='应执行未执行'?'异常未执行':state.issue==='失败'?'发送失败':state.issue==='待回调'?'待回调':'';
  content.innerHTML=`<div class="row"><h3>${state.page==='总览'?'执行概览':state.page+' · 类型监控'}</h3><span class="sub">${a.length} 条记录 · ${state.date||'国家默认日期'}</span></div>${controls(base)}${moduleNav()}<div class="thresholds"><label>实发率提示阈值（%）<input id="send-threshold" type="number" min="0" max="100" step="0.01" value="${state.sendThreshold}"></label><label>回调率提示阈值（%）<input id="callback-threshold" type="number" min="0" max="100" step="0.01" value="${state.callbackThreshold}"></label><button data-threshold>应用阈值</button><span class="sub">默认按打开页面时默认日期的有效批次率第10百分位设定：实发${defaultSendThreshold}%，回调${defaultCallbackThreshold}%；实发${sendSamples.length}批、回调${callbackSamples.length}批。仅为快照提示线。</span></div>${drill?`<p class="filter-note">已定位：${drill}任务 · ${a.length} 条 <button data-clear-drill>清除定位</button></p>`:''}${state.age||state.matrixType?`<p class="filter-note">地图筛选：${state.matrixType||'全部类型'} / ${state.age||'全部账龄'}${state.hour?' / '+state.hour+':00':''} <button data-clear-map>清除地图筛选</button></p>`:''}${summary(a)}${matrix(base,'age')}${aggregate(a)}${hourly(base)}${detail(a)}${selected()}${rules()}`;
}
function exportRows(a){
  const columns=[['国家',r=>r.country],['数据日期',r=>r.date],['策略名称',r=>r.name],['策略ID',r=>r.id],['触达类型',r=>r.type],['账龄',r=>r.age],['计划时间',r=>r.time],['实际开始执行时间',r=>r.startedAt],['执行总时长',r=>r.duration],['执行状态',r=>r.status],['应发数量',r=>r.n],['实发数量',r=>r.s],['发送失败数量',r=>r.f],['已回调数量',r=>r.c],['待回调数量',r=>r.p],['实发率',r=>pct(rate(r.s,r.n))],['回调率',r=>pct(rate(r.c,r.s))],['执行批次',r=>r.batch]];
  const cell=v=>{const raw=String(v===null||v===undefined||v===''?'—':v),safe=/^[=+\-@\t\r]/.test(raw)?"'"+raw:raw;return '"'+safe.replace(/"/g,'""')+'"'};
  const lines=[columns.map(([name])=>cell(name)).join(','),...a.map(r=>columns.map(([,get])=>cell(get(r))).join(','))];
  const blob=new Blob(['\ufeff',lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');
  link.href=url;link.download='策略任务执行明细_'+(state.date||(state.country?countryDefaultDate(state.country):beijingToday()))+'.csv';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
root.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.hasAttribute('data-jump-issue')){
    const kind=b.dataset.jumpIssue;
    Object.assign(state,{hour:'',age:'',matrixType:'',q:'',status:kind==='late'?'应执行未执行':'',issue:kind==='failed'?'失败':kind==='pending'?'待回调':'',pageNo:1,selected:null});
    render();document.getElementById('detail-section').scrollIntoView({block:'start'});
  }else if(b.hasAttribute('data-export')){
    exportRows(filtered(scopeRows()));
  }else if(b.hasAttribute('data-cell-type')){
    Object.assign(state,{matrixType:b.dataset.cellType,age:b.dataset.cellAge||'',hour:b.dataset.cellHour||'',q:'',status:'',issue:'',pageNo:1,selected:null});
    render();document.getElementById('detail-section').scrollIntoView({block:'start'});
  }else if(b.hasAttribute('data-threshold')){
    const s=root.querySelector('#send-threshold'),c=root.querySelector('#callback-threshold');
    if(!s.reportValidity()||!c.reportValidity()||s.value===''||c.value==='')return;
    state.sendThreshold=Number(s.value);state.callbackThreshold=Number(c.value);render();
  }else if(b.hasAttribute('data-clear-map')){
    Object.assign(state,{age:'',matrixType:'',hour:'',pageNo:1});render();
  }else if(b.hasAttribute('data-clear-drill')){
    Object.assign(state,{status:'',issue:'',pageNo:1});render();
  }else if(b.hasAttribute('data-reset')||b.dataset.nav){state.age='';state.matrixType='';if(b.hasAttribute('data-reset'))state.date=''}
},true);
function selected(){const html=baseSelected(),r=rows.find(x=>x.i===state.selected);if(!r)return html;return html.replace('<div class="steps">',`<div class="rate-overview"><div><span class="sub">实发率</span><strong>${rateLabel({v:rate(r.s,r.n),missing:0},'send')}</strong></div><div><span class="sub">回调率</span><strong>${rateLabel({v:rate(r.c,r.s),missing:0},'callback')}</strong></div></div><div class="steps">`)}
function matrix(a,mode){
  if(mode!=='age')return matrixFull(a);
  const showTypes=types.filter(t=>a.some(r=>r.type===t));
  return `<section class="panel" id="age-section"><div class="row"><h3>策略地图</h3><span class="sub">类型 × 账龄 · 点击筛选明细 · 跨段及不明确名称归其他</span></div><div class="matrix-legend"><span class="execution-low">红：存在异常未执行</span></div><div class="scroll"><table class="matrix age-counts" id="age-matrix"><thead><tr><th>类型 / 账龄</th>${ages.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${showTypes.map(t=>`<tr><th>${t}</th>${ages.map(col=>{const b=a.filter(r=>r.type===t&&r.age===col),p=counts(b),s=strategyCounts(b);if(!b.length)return '<td class="matrix-empty">—</td>';return `<td><button class="matrix-cell ${p.late?'has-late':''}" data-cell-type="${t}" data-cell-age="${col}" aria-label="${t} ${col}，${s.total}个策略，${p.total}次计划执行，${p.late}次异常未执行"><span class="age-metric"><span>策略数量</span><b>${s.total}<small>个</small></b></span><span class="age-metric"><span>计划执行</span><b>${p.total}<small>次</small></b></span><span class="age-metric age-exception ${p.late?'execution-low':''}"><span>异常未执行</span><b>${p.late}<small>次</small></b></span></button></td>`}).join('')}</tr>`).join('')}</tbody></table></div></section>`;
}

root.addEventListener('change',e=>{
  if(!['sm-country','sm-date'].includes(e.target.id))return;
  const scope=e.target.id==='sm-country'?{country:e.target.value,date:''}:{date:e.target.value};
  Object.assign(state,{...scope,hour:'',age:'',matrixType:'',q:'',status:'',issue:'',pageNo:1,selected:null});
  render();
});
let displayedBeijingDay=beijingToday();
setInterval(()=>{
  const today=beijingToday();
  if(today===displayedBeijingDay)return;
  displayedBeijingDay=today;
  if(!state.date){Object.assign(state,{pageNo:1,selected:null});render()}
},60000);

root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;let scroll=false;if(b.dataset.nav){state.page=b.dataset.nav;state.q='';state.status='';state.issue='';state.pageNo=1;state.selected=null;}else if(b.hasAttribute('data-filter')){state.q=root.querySelector('#sm-q').value.trim();state.hour=root.querySelector('#sm-hour').value;state.status=root.querySelector('#sm-status').value;state.issue=root.querySelector('#sm-issue').value;state.pageNo=1;state.selected=null;}else if(b.hasAttribute('data-reset'))Object.assign(state,{hour:'',q:'',status:'',issue:'',pageNo:1,selected:null});else if(b.hasAttribute('data-alert'))Object.assign(state,{status:'应执行未执行',issue:'',pageNo:1,selected:null});else if(b.hasAttribute('data-hour')){state.hour=state.hour===b.dataset.hour?'':b.dataset.hour;state.pageNo=1;state.selected=null;}else if(b.hasAttribute('data-prev'))state.pageNo--;else if(b.hasAttribute('data-next'))state.pageNo++;else if(b.hasAttribute('data-detail')){state.selected=Number(b.dataset.detail);scroll=true;}else if(b.hasAttribute('data-close'))state.selected=null;else return;render();if(scroll)document.getElementById('batch-trace').scrollIntoView({block:'nearest'});});
root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='sm-q')root.querySelector('[data-filter]').click()});
render();
})();








</script></div></body></html>
